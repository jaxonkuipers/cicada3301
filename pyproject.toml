# Not a package: lib/ and tools/ run in place with `python3 -m`, stdlib only.
# This file only configures tooling.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E741",  # ambiguous single-letter names: rune/cipher math uses them deliberately
]
