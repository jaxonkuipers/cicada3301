# The stdlib-only solver package and its CLI run in place with `python3 -m`.
# This file configures repository tooling; the project is not distributed.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E741",  # ambiguous single-letter names: rune/cipher math uses them deliberately
]
