# The three commands AGENTS.md tells a session to run, run on every push.
# "On any FAIL, stop" is only a rule if something enforces it.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the code targets (ruff's target-version) and the version
        # agents actually develop on. Validating only the floor means a
        # session runs one interpreter and CI blesses another.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      # First and separately: if the corpus or the parser drifted, every
      # derived result is void and a green test suite would be misleading.
      - name: corpus drift check
        run: python3 -m lib.corpus

      - name: tests
        run: python3 -m unittest discover -s tests

      - name: lint
        run: pipx run ruff==0.15.20 check lib tools tests
