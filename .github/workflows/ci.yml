name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: corpus
        run: python3 -m solver.corpus
      - name: tests
        run: python3 -m unittest discover -s tests
      - name: lint
        run: pipx run ruff==0.15.20 check solver tests
