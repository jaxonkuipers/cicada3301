# The three commands AGENTS.md tells a session to run, run on every push.
# "On any FAIL, stop" is only a rule if something enforces it.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # First and separately: if the corpus or the parser drifted, every
      # derived result is void and a green test suite would be misleading.
      - name: corpus drift check
        run: python3 -m lib.corpus

      - name: tests
        run: python3 -m unittest discover -s tests

      - name: lint
        run: pipx run ruff==0.15.20 check lib tools tests
